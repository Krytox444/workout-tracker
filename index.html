<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Workout Tracker</title>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;padding:12px}
.container{max-width:600px;margin:0 auto}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px;margin-bottom:12px}
h1{font-size:22px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;padding:9px 6px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px;transition:all .2s;text-align:center}
.tab.active{background:#2563eb;color:#fff}
.tab:not(.active){background:#334155;color:#94a3b8}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#0f172a;border-radius:10px;padding:12px}
.stat-label{font-size:11px;color:#64748b;margin-bottom:2px}
.stat-value{font-size:24px;font-weight:700}
/* Search + dropdown */
.search-wrap{position:relative;margin-bottom:8px}
.search-wrap input{margin-bottom:0}
.dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#1e293b;border:1px solid #334155;border-radius:10px;z-index:200;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;max-height:220px;overflow-y:auto}
.dropdown.show{display:block}
.dd-cat{padding:5px 12px;font-size:10px;color:#475569;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:#0f172a;position:sticky;top:0}
.dd-item{padding:10px 14px;cursor:pointer;font-size:14px}
.dd-item:hover,.dd-item:active{background:#334155}
.hl{color:#60a5fa;font-weight:700}
/* Inputs */
input,select{width:100%;padding:11px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#fff;font-size:15px;margin-bottom:8px;outline:none;-webkit-appearance:none}
input:focus,select:focus{border-color:#2563eb}
input::placeholder{color:#475569}
.set-row{display:grid;grid-template-columns:32px 1fr 1fr 32px;gap:6px;align-items:center;margin-bottom:6px}
.set-row span{color:#64748b;font-size:12px;font-weight:600;text-align:center}
.set-row input{margin-bottom:0}
/* Buttons */
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;margin-top:6px}
.btn-primary{background:#2563eb;color:#fff}
.btn-secondary{background:#334155;color:#cbd5e1}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:6px;border:none;cursor:pointer;font-weight:600}
.btn-icon{background:none;border:none;color:#64748b;cursor:pointer;padding:4px 8px;font-size:14px;border-radius:6px}
.btn-icon:hover{background:#334155}
.btn-del{background:none;border:none;color:#475569;cursor:pointer;padding:4px;font-size:15px;line-height:1}
/* Date groups */
.date-group{margin-bottom:8px}
.date-header{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#1e293b;border:1px solid #334155;border-radius:10px;cursor:pointer;margin-bottom:5px;user-select:none}
.date-left{display:flex;align-items:center;gap:8px}
.date-label{font-weight:700;font-size:14px}
.date-count{font-size:12px;color:#64748b}
.date-vol{font-size:12px;color:#60a5fa;font-weight:600}
.expand-icon{color:#475569;font-size:10px;transition:transform .2s;flex-shrink:0}
/* Workout cards */
.w-card{background:#0f172a;border:1px solid #1e293b;border-radius:10px;margin-bottom:5px;overflow:hidden}
.w-card-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer}
.w-card-left{flex:1;min-width:0}
.w-card-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-card-meta{font-size:11px;color:#64748b;margin-top:2px}
.w-card-right{display:flex;gap:5px;align-items:center;flex-shrink:0;margin-left:8px}
.chip{font-size:11px;font-weight:700;padding:3px 7px;border-radius:20px;white-space:nowrap}
.chip-blue{background:#1e3a5f;color:#60a5fa}
.chip-orange{background:#431407;color:#fb923c}
.sets-grid{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 10px;border-top:1px solid #1e293b;padding-top:8px;margin-top:0}
.set-chip{background:#1e293b;border-radius:6px;padding:5px 9px;font-size:12px;color:#94a3b8}
.set-chip strong{color:#e2e8f0}
/* Templates */
.tpl-card{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px;margin-bottom:8px}
.tpl-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tpl-name{font-weight:700;font-size:15px}
.tpl-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.ex-tag{background:#1e3a5f;color:#60a5fa;padding:3px 8px;border-radius:20px;font-size:12px}
.tpl-actions{display:flex;gap:6px;flex-wrap:wrap}
/* Hint box */
.hint-box{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;margin-bottom:8px}
.hint-box p{font-size:11px;color:#64748b;margin-bottom:5px}
.hint-chips{display:flex;flex-wrap:wrap;gap:4px}
.hint-chip{background:#1e293b;border-radius:5px;padding:3px 7px;font-size:12px;color:#94a3b8}
/* Chart */
.chart-wrap{position:relative;user-select:none}
svg.chart{display:block;width:100%;overflow:visible}
.tooltip{position:absolute;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px 10px;font-size:12px;pointer-events:none;display:none;min-width:130px;z-index:10}
.tt-date{color:#64748b;margin-bottom:4px;font-size:11px}
.tt-row{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.tt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
/* Superset */
.sup-ex-block{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px;margin-bottom:6px}
.sup-ex-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em}
.sup-connector{text-align:center;color:#475569;font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 0;margin:2px 0}
.sup-badge{background:#312e81;color:#a5b4fc;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.04em}
/* Misc */
.section-label{font-size:11px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.empty{text-align:center;padding:40px 0;color:#475569}
.quick-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.quick-scroll::-webkit-scrollbar{display:none}
.green{color:#34d399}.red{color:#f87171}.blue{color:#60a5fa}
/* Settings modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#1e293b;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:600px;max-height:80vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:17px;font-weight:700}
</style>
</head>
<body>
<div class="container">
<div class="card">
  <h1>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.5">
      <path d="M6.5 6.5l11 11M17 7l1.5-1.5a2 2 0 0 1 2.83 2.83L19.83 9.8a2 2 0 0 1-2.83 0L17 9.63A2 2 0 0 1 17 7zM7 17l-1.5 1.5a2 2 0 0 1-2.83-2.83L4.17 14.2a2 2 0 0 1 2.83 0L7 14.37A2 2 0 0 1 7 17z"/>
    </svg>
    Workout Tracker
    <button class="btn-icon" onclick="openSettings()" style="margin-left:auto;font-size:20px;padding:4px 8px">⚙️</button>
  </h1>
  <div class="tabs">
    <button class="tab active" onclick="showTab('log')">📋 Log</button>
    <button class="tab" onclick="showTab('templates')">📁 Templates</button>
    <button class="tab" onclick="showTab('progress')">📈 Progression</button>
  </div>

  <!-- LOG -->
  <div id="tab-log">
    <div class="stats">
      <div class="stat"><div class="stat-label">Total øvelser</div><div class="stat-value" id="total-count">0</div></div>
      <div class="stat"><div class="stat-label">Total volumen</div><div class="stat-value blue" id="total-vol">0 kg</div></div>
    </div>
    <div id="quick-templates"></div>
    <div class="section-label">Ny øvelse</div>
    <div class="search-wrap">
      <input type="text" id="exercise-input" placeholder="Søg øvelse (fx Dødløft)..." oninput="onExInput(this.value)" autocomplete="off">
      <div class="dropdown" id="ex-dd"></div>
    </div>
    <div id="hint-box" style="display:none" class="hint-box">
      <p>Sidst du trænede denne øvelse:</p>
      <div class="hint-chips" id="hint-sets"></div>
    </div>
    <div id="bw-info" style="display:none" class="hint-box">
      <div id="bw-info-content"></div>
    </div>
    <div class="set-row" style="margin-bottom:4px">
      <span></span><span id="reps-label" style="font-size:11px;color:#475569;text-align:center">REPS</span><span id="kg-label" style="font-size:11px;color:#475569;text-align:center">KG</span><span></span>
    </div>
    <div id="sets-container"></div>
    <button class="btn btn-secondary" onclick="addSetRow()">+ Tilføj set</button>
    <button class="btn btn-primary" onclick="saveWorkout()">💾 Log set</button>
    <button class="btn btn-secondary" onclick="toggleSupersetForm()" id="sup-toggle-btn">🔄 Superset</button>
    <div id="superset-form" style="display:none;margin-top:8px">
      <div class="section-label">Superset</div>
      <div id="sup-ex-container"></div>
      <button class="btn btn-secondary" onclick="addSupExercise()" style="margin-top:4px">+ Tilføj øvelse</button>
      <button class="btn btn-primary" onclick="saveSuperset()">💾 Log superset</button>
      <button class="btn btn-secondary" onclick="toggleSupersetForm()">Annuller</button>
    </div>
  </div>

  <!-- TEMPLATES -->
  <div id="tab-templates" style="display:none">
    <div id="tpl-form">
      <div class="section-label" id="tpl-form-label">Ny template</div>
      <input type="text" id="tpl-name" placeholder="Navn (fx Push Day)">
      <div id="tpl-ex-list"></div>
      <div class="search-wrap">
        <input type="text" id="tpl-ex-input" placeholder="Søg og tilføj øvelse..." oninput="onTplExInput(this.value)" autocomplete="off">
        <div class="dropdown" id="tpl-dd"></div>
      </div>
      <button class="btn btn-secondary" onclick="addTplExFromInput()">+ Tilføj øvelse</button>
      <button class="btn btn-primary" onclick="saveTemplate()" style="margin-top:4px">💾 Gem template</button>
      <button class="btn btn-secondary" id="tpl-cancel-btn" style="display:none" onclick="cancelEditTpl()">Annuller redigering</button>
    </div>
    <div style="margin-top:16px" id="template-list"></div>
    <div id="custom-exercises-section"></div>
  </div>

  <!-- PROGRESSION -->
  <div id="tab-progress" style="display:none">
    <select id="ex-select" onchange="renderProgress()"><option value="">Vælg øvelse...</option></select>
    <div id="progress-content"></div>
  </div>
</div>

<div id="workout-log"></div>
</div>

<!-- Settings modal -->
<div id="settings-modal" style="display:none" class="modal-overlay" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">⚙️ Indstillinger</span>
      <button class="btn-icon" onclick="closeSettings()" style="font-size:20px">✕</button>
    </div>
    <div class="section-label">Kropsmål</div>
    <label style="font-size:12px;color:#64748b;display:block;margin-bottom:4px">Kropsvægt (kg)</label>
    <input type="number" id="set-bodyweight" placeholder="fx 80" min="30" max="300" step="0.5" inputmode="decimal">
    <label style="font-size:12px;color:#64748b;display:block;margin-bottom:4px">Højde (cm)</label>
    <input type="number" id="set-height" placeholder="fx 180" min="100" max="250" inputmode="numeric">
    <button class="btn btn-primary" onclick="saveSettings()">💾 Gem indstillinger</button>
  </div>
</div>

<script>
// ── Data ────────────────────────────────────────────────────────
let workouts  = JSON.parse(localStorage.getItem('wt_workouts')  || '[]');
let templates = JSON.parse(localStorage.getItem('wt_templates') || '[]');
const save = () => {
  localStorage.setItem('wt_workouts',  JSON.stringify(workouts));
  localStorage.setItem('wt_templates', JSON.stringify(templates));
};

const EXERCISES = {
  'Bryst':     ['Bænkpres','Incline Bænkpres','Decline Bænkpres','Dips','Kabelflyes','Dumbbell Flyes','Push-ups','Chest Press Maskine','Pec Deck'],
  'Ryg':       ['Dødløft','Pull-ups','Chin-ups','Bent-over Row','Cable Row','Lat Pulldown','T-bar Row','Seated Row','Rack Pull',"Farmer's Carry",'Pendlay Row'],
  'Skuldre':   ['Skulderpress','Lateral Raise','Front Raise','Face Pull','Arnold Press','Upright Row','Rear Delt Fly','Overhead Press','Cable Lateral Raise'],
  'Ben':       ['Squat','Front Squat','Leg Press','Lunges','Romanian Deadlift','Leg Curl','Leg Extension','Bulgarian Split Squat','Hip Thrust','Calf Raises','Step-ups','Hack Squat','Sumo Deadlift','Goblet Squat'],
  'Biceps':    ['Barbell Curl','Dumbbell Curl','Hammer Curl','Preacher Curl','Cable Curl','Concentration Curl','Spider Curl','Incline Dumbbell Curl'],
  'Triceps':   ['Tricep Pushdown','Skullcrusher','Overhead Tricep Extension','Close-grip Bænkpres','Tricep Kickback','JM Press','Diamond Push-ups'],
  'Core':      ['Planke','Crunches','Leg Raises','Russian Twist','Cable Crunch','Ab Rollout','Hanging Leg Raise','Side Planke'],
  'Kondition': ['Løb','Cykling','Roning','Jump Rope','Assault Bike','Svømning']
};
const ALL_EX = Object.values(EXERCISES).flat();
const EX_CAT = {};
Object.entries(EXERCISES).forEach(([cat, exs]) => exs.forEach(e => EX_CAT[e] = cat));

const BW_EXERCISES = new Set(['Pull-ups','Chin-ups','Dips','Push-ups','Diamond Push-ups','Planke','Crunches','Leg Raises','Russian Twist','Ab Rollout','Hanging Leg Raise','Side Planke','Step-ups']);
const CARDIO_EXERCISES = new Set(['Løb','Cykling','Roning','Jump Rope','Assault Bike','Svømning']);
let isCardioMode = false;

function getSettings() { return JSON.parse(localStorage.getItem('wt_settings') || '{}'); }
function openSettings() {
  const s=getSettings();
  document.getElementById('set-bodyweight').value=s.bodyweight||'';
  document.getElementById('set-height').value=s.height||'';
  document.getElementById('settings-modal').style.display='flex';
}
function closeSettings() { document.getElementById('settings-modal').style.display='none'; }
function saveSettings() {
  const bw=parseFloat(document.getElementById('set-bodyweight').value);
  const h=parseInt(document.getElementById('set-height').value);
  const s=getSettings();
  if (bw>0) s.bodyweight=bw;
  if (h>0) s.height=h;
  localStorage.setItem('wt_settings',JSON.stringify(s));
  closeSettings();
  updateBWInfo(document.getElementById('exercise-input').value.trim());
}
function updateExerciseMode(exName) {
  const isBW    = BW_EXERCISES.has(exName);
  const isCardio= CARDIO_EXERCISES.has(exName);
  isCardioMode  = isCardio;
  const box  = document.getElementById('bw-info');
  const rLbl = document.getElementById('reps-label');
  const kLbl = document.getElementById('kg-label');
  if (isCardio) {
    rLbl.textContent='MIN'; kLbl.textContent='KM'; box.style.display='none'; return;
  }
  rLbl.textContent='REPS';
  if (!isBW) { box.style.display='none'; kLbl.textContent='KG'; return; }
  const bw=getSettings().bodyweight;
  kLbl.textContent='+KG (ekstra)'; box.style.display='';
  document.getElementById('bw-info-content').innerHTML = bw
    ? `<span style="font-size:13px">Kropsvægt: <strong style="color:#34d399">${bw} kg</strong> — tilføj evt. ekstra kg per set</span>`
    : `<span style="font-size:13px;color:#fb923c">⚠️ Sæt din kropsvægt i <button onclick="openSettings()" style="background:none;border:none;color:#60a5fa;cursor:pointer;font-size:13px;font-weight:600;padding:0">Indstillinger ⚙️</button> for at beregne volumen</span>`;
}
function updateBWInfo(exName) { updateExerciseMode(exName); }

// ── Helpers ─────────────────────────────────────────────────────
const calc1RM  = (w,r) => r<=0 ? w : Math.round(w*(1+r/30));
const calcVol  = sets  => sets[0]?.cardio ? sets.reduce((s,x)=>s+x.distance,0) : sets.reduce((s,x) => s + x.reps*x.weight, 0);
const getMax1RM= sets  => sets[0]?.cardio ? 0 : Math.max(...sets.map(s => calc1RM(s.weight,s.reps)));
const getMaxW  = sets  => sets[0]?.cardio ? 0 : Math.max(...sets.map(s => s.weight));

// ── Fuzzy search ─────────────────────────────────────────────────
function fuzzyScore(str, q) {
  str = str.toLowerCase(); q = q.toLowerCase();
  if (str === q)         return 100;
  if (str.startsWith(q)) return 90;
  if (str.includes(q))   return 80;
  let qi=0;
  for (let i=0; i<str.length && qi<q.length; i++) if (str[i]===q[qi]) qi++;
  if (qi===q.length) return 55+(qi/str.length)*20;
  let m=0; for (const c of q) if (str.includes(c)) m++;
  return (m/q.length)*35;
}
function getMatches(query, limit=8) {
  const customCats = JSON.parse(localStorage.getItem('wt_custom_cats') || '{}');
  const fromWorkouts = workouts.map(w=>w.exercise).filter(e=>!ALL_EX.includes(e));
  const pool = [...new Set([...ALL_EX, ...Object.keys(customCats), ...fromWorkouts])];
  if (!query) return pool.slice(0,limit).map(ex=>({ex,score:50}));

  // Check if query matches a category name
  const catMatch = Object.keys(EXERCISES).find(cat => fuzzyScore(cat, query) > 60);
  if (catMatch) {
    return EXERCISES[catMatch].map(ex=>({ex, score:95}));
  }

  return pool.map(ex=>({ex,score:fuzzyScore(ex,query)}))
    .filter(x=>x.score>20).sort((a,b)=>b.score-a.score).slice(0,limit);
}
function hl(text, query) {
  if (!query) return text;
  const i = text.toLowerCase().indexOf(query.toLowerCase());
  if (i===-1) return text;
  return text.slice(0,i)+`<span class="hl">${text.slice(i,i+query.length)}</span>`+text.slice(i+query.length);
}

// ── Dropdown ─────────────────────────────────────────────────────
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) closeDD(); });

function closeDD() {
  document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
}

function renderDD(ddId, query, onSelect) {
  const dd = document.getElementById(ddId);
  if (!query || query.length < 1) { dd.classList.remove('show'); return; }
  const matches = getMatches(query);
  if (!matches.length) { dd.classList.remove('show'); return; }
  const grouped = {};
  matches.forEach(({ex}) => {
    const cat = EX_CAT[ex] || 'Egne øvelser';
    (grouped[cat]=grouped[cat]||[]).push(ex);
  });
  dd.innerHTML = Object.entries(grouped).map(([cat,exs]) =>
    `<div class="dd-cat">${cat}</div>`
    + exs.map(ex => `<div class="dd-item" onmousedown="event.preventDefault()" onclick="${onSelect}('${ex.replace(/'/g,"\\'")}')">${hl(ex,query)}</div>`).join('')
  ).join('');
  // Add "create new" option only in the log dropdown
  const exactMatch = matches.some(({ex}) => ex.toLowerCase() === query.toLowerCase());
  if (!exactMatch && ddId === 'ex-dd') {
    dd.innerHTML += `<div class="dd-cat">Ny øvelse</div>
      <div class="dd-item" style="color:#60a5fa" onmousedown="event.preventDefault()" onclick="${onSelect}('${query.replace(/'/g,"\\'")}')")>+ Opret "${query}"</div>`;
  }
  dd.classList.add('show');
}

// ── Log ──────────────────────────────────────────────────────────
let setCount=1, expandedDates=new Set(), expandedCards=new Set(), editingCards=new Set();

function onExInput(val) {
  renderDD('ex-dd', val, 'selectExercise');
  const last = workouts.find(w=>w.exercise.toLowerCase()===val.toLowerCase());
  const box  = document.getElementById('hint-box');
  if (last) {
    box.style.display='';
    document.getElementById('hint-sets').innerHTML=last.sets.map(s=>s.cardio?`<span class="hint-chip">${s.duration}min · ${s.distance}km</span>`:`<span class="hint-chip">${s.reps}×${s.weight}kg</span>`).join('');
  } else box.style.display='none';
  updateBWInfo(val);
}
function selectExercise(name) {
  document.getElementById('exercise-input').value = name;
  closeDD(); onExInput(name);
  // If custom exercise, ask for category
  if (!ALL_EX.includes(name)) {
    const customCats = JSON.parse(localStorage.getItem('wt_custom_cats') || '{}');
    if (!customCats[name]) showCatPicker(name);
  }
}

function showCatPicker(name) {
  const existing = document.getElementById('cat-picker');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.id = 'cat-picker';
  div.style.cssText = 'background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px;margin-bottom:8px';
  div.innerHTML = `<p style="font-size:12px;color:#64748b;margin-bottom:8px">Hvilken kategori tilhører "<strong style="color:#fff">${name}</strong>"?</p>

function addSetRow(reps='',weight='') {
  const c=document.getElementById('sets-container');
  const n=setCount++;
  const d=document.createElement('div');
  d.className='set-row';
  d.innerHTML=`<span style="color:#64748b;font-size:12px;font-weight:600;text-align:center">${n}</span>
    <input type="number" placeholder="0" value="${reps}" min="1" inputmode="numeric">
    <input type="number" placeholder="0" value="${weight}" min="0" step="0.5" inputmode="decimal">
    <button class="btn-del" onclick="this.parentNode.remove();renumberSets()">✕</button>`;
  c.appendChild(d);
}
function renumberSets() {
  document.querySelectorAll('#sets-container .set-row').forEach((r,i)=>r.querySelector('span').textContent=i+1);
  setCount=document.querySelectorAll('#sets-container .set-row').length+1;
}
function saveWorkout() {
  const ex=document.getElementById('exercise-input').value.trim();
  if (!ex) return alert('Indtast øvelsesnavn!');
  const isBW    = BW_EXERCISES.has(ex);
  const isCardio= CARDIO_EXERCISES.has(ex);
  const bw=getSettings().bodyweight;
  if (isBW&&!bw) return alert('Sæt din kropsvægt i Indstillinger (⚙️) før du logger denne øvelse!');
  const sets=[];
  document.querySelectorAll('#sets-container .set-row').forEach(row=>{
    const [i1,i2]=row.querySelectorAll('input');
    if (isCardio) {
      const dur=parseInt(i1.value)||0, dist=parseFloat(i2.value)||0;
      if (dur>0||dist>0) sets.push({duration:dur,distance:dist,cardio:true});
    } else if (isBW) {
      const r=parseInt(i1.value),extra=parseFloat(i2.value)||0;
      if (r>0) sets.push({reps:r,weight:bw+extra,extraKg:extra,bw:true});
    } else {
      const r=parseInt(i1.value),w=parseFloat(i2.value);
      if (r>0&&w>0) sets.push({reps:r,weight:w});
    }
  });
  if (!sets.length) return alert('Tilføj mindst ét set!');
  workouts.unshift({id:Date.now(),exercise:ex,sets,date:new Date().toISOString(),displayDate:new Date().toLocaleDateString('da-DK')});
  save();
  document.getElementById('exercise-input').value='';
  document.getElementById('hint-box').style.display='none';
  document.getElementById('sets-container').innerHTML='';
  setCount=1; addSetRow();
  updateBWInfo('');
  renderLog(); updateStats();
}
function deleteWorkout(id) {
  workouts=workouts.filter(w=>w.id!==id); save(); renderLog(); updateStats();
}
function startEditWorkout(id) {
  editingCards.add(id); expandedCards.add(id); renderLog();
}
function cancelEditWorkout(id) {
  editingCards.delete(id); renderLog();
}
function saveEditWorkout(id) {
  const w=workouts.find(x=>x.id===id); if (!w) return;
  const isCardio=w.sets[0]?.cardio;
  const setsMap={};
  document.querySelectorAll(`[data-edit-id="${id}"]`).forEach(inp=>{
    const i=inp.dataset.idx;
    if (!setsMap[i]) setsMap[i]={};
    setsMap[i][inp.dataset.field]=parseFloat(inp.value)||0;
    if (isCardio) setsMap[i].cardio=true;
  });
  const newSets=isCardio
    ? Object.values(setsMap).filter(s=>s.duration>0||s.distance>0)
    : Object.values(setsMap).filter(s=>s.reps>0&&s.weight>0);
  if (!newSets.length) return alert('Tilføj mindst ét set!');
  w.sets=newSets; save(); editingCards.delete(id); renderLog(); updateStats();
}
function toggleDate(date) {
  expandedDates.has(date)?expandedDates.delete(date):expandedDates.add(date); renderLog();
}
function toggleCard(id) {
  expandedCards.has(id)?expandedCards.delete(id):expandedCards.add(id); renderLog();

function renderLog() {

      if (w.type==='superset') {

            ${w.exercises.map((ex,ei)=>`
              ${ei>0?'<div class="sup-connector" style="margin:6px 0">⊕ SUPERSET</div>':''}
              <div style="font-size:13px;font-weight:700;margin-bottom:4px;color:#e2e8f0">${ex.name}</div>
              <div class="sets-grid" style="padding:0;border:none;margin-bottom:0">

              </div>`).join('')}

          </div>

            ${w.sets[0]?.cardio
              ? `<span class="chip chip-blue">${w.sets.reduce((s,x)=>s+x.distance,0).toFixed(1)} km</span><span class="chip chip-orange">${w.sets.reduce((s,x)=>s+x.duration,0)} min</span>`
              : `<span class="chip chip-blue">${calcVol(w.sets)}kg</span><span class="chip chip-orange">1RM ${getMax1RM(w.sets)}kg</span>`}
            <button class="btn-icon" onclick="event.stopPropagation();startEditWorkout(${w.id})" title="Rediger">✏️</button>
            <button class="btn-del" onclick="event.stopPropagation();deleteWorkout(${w.id})">🗑</button>
            <span class="expand-icon" style="transform:rotate(${open?'180':'0'}deg)">▼</span>
          </div>
        </div>
        ${open?(editing?`
          <div style="padding:8px 12px 12px">
            ${w.sets.map((s,i)=>`
              <div class="set-row" style="margin-bottom:6px">
                <span style="color:#64748b;font-size:12px;font-weight:600;text-align:center">${i+1}</span>

            <div style="display:flex;gap:6px;margin-top:4px">
              <button class="btn btn-primary" style="margin-top:0" onclick="saveEditWorkout(${w.id})">Gem</button>

function updateStats() {

let supExCount=0, supExNames={}, currentSupIdx=null;

function toggleSupersetForm() {

function addSupExercise() {

  const c=document.getElementById('sup-ex-container');

    const conn=document.createElement('div');
    conn.className='sup-connector'; conn.id=`sup-conn-${idx}`;

function removeSupEx(idx) {

function onSupExInput(idx, val) {
  currentSupIdx=idx;
  renderDD(`sup-dd-${idx}`, val, 'selectCurrentSupEx');
}
function selectCurrentSupEx(name) {
  const idx=currentSupIdx;
  supExNames[idx]=name;
  document.getElementById(`sup-input-${idx}`).value=name;
  closeDD();
}
function addSupSetRow(idx, reps='', weight='') {
  const c=document.getElementById(`sup-sets-${idx}`); if (!c) return;
  const n=c.querySelectorAll('.set-row').length+1;
  const d=document.createElement('div'); d.className='set-row';
  d.innerHTML=`<span style="color:#64748b;font-size:12px;font-weight:600;text-align:center">${n}</span>
    <input type="number" placeholder="0" value="${reps}" min="1" inputmode="numeric">
    <input type="number" placeholder="0" value="${weight}" min="0" step="0.5" inputmode="decimal">
    <button class="btn-del" onclick="this.parentNode.remove()">✕</button>`;
  c.appendChild(d);
}
function saveSuperset() {
  const exercises=[];
  for (let i=0;i<supExCount;i++) {
    const block=document.getElementById(`sup-block-${i}`); if (!block) continue;
    const name=(document.getElementById(`sup-input-${i}`)?.value||'').trim(); if (!name) continue;
    const isBW=BW_EXERCISES.has(name), bw=getSettings().bodyweight;
    const sets=[];
    block.querySelectorAll('.set-row').forEach(row=>{
      const [i1,i2]=row.querySelectorAll('input');
      if (!i1||!i2) return; // skip header row
      const r=parseInt(i1.value),w=parseFloat(i2.value)||0;
      if (isBW) { if (r>0&&bw) sets.push({reps:r,weight:bw+w,extraKg:w,bw:true}); }
      else { if (r>0&&w>0) sets.push({reps:r,weight:w}); }
    });
    if (name&&sets.length) exercises.push({name,sets});
  }
  if (exercises.length<2) return alert('Tilføj mindst 2 øvelser med sets til supersettet!');
  workouts.unshift({id:Date.now(),type:'superset',exercises,date:new Date().toISOString(),displayDate:new Date().toLocaleDateString('da-DK')});
  save(); toggleSupersetForm(); renderLog(); updateStats();
}

function selectTplEx(name) {

function addTplExFromInput() {

function renderTplExList() {
  document.getElementById('tpl-ex-list').innerHTML=tplExList.map((e,i)=>

      <span style="font-size:14px">${e}</span>
      <button class="btn-del" onclick="tplExList.splice(${i},1);renderTplExList()">✕</button>

function saveTemplate() {
  // Include anything still typed in the input
  const typed=document.getElementById('tpl-ex-input').value.trim();
  if (typed&&!tplExList.includes(typed)) tplExList.push(typed);
  const name=document.getElementById('tpl-name').value.trim();
  if (!name)            return alert('Giv templaten et navn!');
  if (!tplExList.length) return alert('Tilføj mindst én øvelse!');
  if (editingTplId) {
    const idx=templates.findIndex(t=>t.id===editingTplId);
    if (idx!==-1) templates[idx]={...templates[idx],name,exercises:[...tplExList]};
    editingTplId=null;
  } else {
    templates.unshift({id:Date.now(),name,exercises:[...tplExList]});
  }
  save();
  document.getElementById('tpl-name').value='';
  document.getElementById('tpl-ex-input').value='';
  tplExList=[]; renderTplExList(); renderTemplates(); renderQuickTemplates();

function editTemplate(id) {

  editingTplId=id;
  document.getElementById('tpl-name').value=tpl.name;
  tplExList=[...tpl.exercises]; renderTplExList();
  document.getElementById('tpl-form-label').textContent='Rediger template';
  document.getElementById('tpl-cancel-btn').style.display='';
  document.getElementById('tpl-form').scrollIntoView({behavior:'smooth'});
}
function cancelEditTpl() {
  editingTplId=null;
  document.getElementById('tpl-name').value='';
  document.getElementById('tpl-ex-input').value='';
  tplExList=[]; renderTplExList();
  document.getElementById('tpl-form-label').textContent='Ny template';
  document.getElementById('tpl-cancel-btn').style.display='none';
}
function deleteTemplate(id) {

// ── Progression ──────────────────────────────────────────────────
function renderExSelect() {
  const exercises=new Set();
  workouts.forEach(w=>{
    if (w.type==='superset') w.exercises.forEach(ex=>exercises.add(ex.name));
    else if (w.exercise) exercises.add(w.exercise);
  });
  const sel=document.getElementById('ex-select'), cur=sel.value;
  sel.innerHTML='<option value="">Vælg øvelse...</option>'
    +[...exercises].map(e=>`<option ${e===cur?'selected':''} value="${e}">${e}</option>`).join('');
}
function renderProgress() {
  const ex=document.getElementById('ex-select').value;
  const el=document.getElementById('progress-content');
  if (!ex) { el.innerHTML=''; return; }
  const sessions=workouts.filter(w=>{
    if (w.type==='superset') return w.exercises.some(e=>e.name===ex);
    return w.exercise===ex;
  }).map(w=>{
    if (w.type==='superset') { const e=w.exercises.find(e=>e.name===ex); return {...w,sets:e.sets,exercise:ex}; }
    return w;
  }).reverse();
  if (!sessions.length) { el.innerHTML='<div class="empty">Ingen data</div>'; return; }
  let overloadHTML='';
  if (sessions.length>=2) {
    const latest=sessions[sessions.length-1], prev=sessions[sessions.length-2];
    const wDiff=getMaxW(latest.sets)-getMaxW(prev.sets);
    const rDiff=getMax1RM(latest.sets)-getMax1RM(prev.sets);
    const prog=wDiff>0||rDiff>0;
    overloadHTML=`<div style="display:flex;align-items:center;gap:8px;padding:10px;border-radius:8px;margin-bottom:10px;font-weight:600;font-size:14px;
      ${prog?'background:rgba(16,185,129,.12);border:1px solid #059669':'background:rgba(234,179,8,.1);border:1px solid #ca8a04'}">
      ${prog?'🏆 Du progresserer!':'⚠️ Ingen fremgang siden sidst'}
    </div>
    <div class="stats" style="margin-bottom:10px">
      <div class="stat"><div class="stat-label">Max vægt ændring</div><div class="stat-value ${wDiff>=0?'green':'red'}">${wDiff>=0?'+':''}${wDiff}kg</div></div>
      <div class="stat"><div class="stat-label">Styrke (est. 1RM)</div><div class="stat-value ${rDiff>=0?'green':'red'}">${rDiff>=0?'+':''}${rDiff}kg</div></div>
    </div>`;
  }
  el.innerHTML=`<div style="margin-top:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:16px;font-weight:700">${ex}</span>
      <span style="font-size:12px;color:#64748b">${sessions.length} sessions</span>
    </div>
    ${overloadHTML}
    ${sessions.length>=2?drawChart(sessions):'<p style="color:#64748b;font-size:13px;margin-top:8px">Log mindst 2 sessions for at se graf</p>'}
  </div>`;
  if (sessions.length>=2) initChart();
}
function drawChart(sessions) {
  const data=sessions.map(s=>({date:s.displayDate,vol:getMaxW(s.sets),rm:getMax1RM(s.sets)}));
  const n=data.length, W=540, H=200, P={t:20,r:50,b:35,l:50};
  const iW=W-P.l-P.r, iH=H-P.t-P.b;
  const vols=data.map(d=>d.vol), rms=data.map(d=>d.rm);
  const vMin=Math.min(...vols)*.9, vMax=Math.max(...vols)*1.1;
  const rMin=Math.min(...rms)*.9,  rMax=Math.max(...rms)*1.1;
  const xOf =i=>P.l+(i/(n-1||1))*iW;
  const yOfV=v=>P.t+iH-((v-vMin)/(vMax-vMin||1))*iH;
  const yOfR=v=>P.t+iH-((v-rMin)/(rMax-rMin||1))*iH;
  const yLbl=(min,max,side)=>[0,.5,1].map(t=>{
    const v=Math.round(min+t*(max-min)), y=P.t+iH*(1-t);
    const x=side==='left'?P.l-6:W-P.r+6, a=side==='left'?'end':'start';
    return `<text x="${x}" y="${y+4}" text-anchor="${a}" fill="${side==='left'?'#34d399':'#fb923c'}" font-size="10">${v}</text>`;
  }).join('');
  const step=Math.max(1,Math.ceil(n/5));
  const xLbl=data.map((d,i)=>i%step!==0&&i!==n-1?'':
    `<text x="${xOf(i)}" y="${H-6}" text-anchor="middle" fill="#64748b" font-size="10">${d.date.slice(0,5)}</text>`).join('');
  const vDots=data.map((d,i)=>`<circle class="dot" cx="${xOf(i)}" cy="${yOfV(d.vol)}" r="5" fill="#34d399" data-date="${d.date}" data-vol="${d.vol}" data-rm="${d.rm}"/>`).join('');
  const rDots=data.map((d,i)=>`<circle class="dot" cx="${xOf(i)}" cy="${yOfR(d.rm)}"  r="5" fill="#fb923c" data-date="${d.date}" data-vol="${d.vol}" data-rm="${d.rm}"/>`).join('');
  return `<div class="chart-wrap" id="chart-wrap">
    <div class="tooltip" id="chart-tip">
      <div class="tt-date" id="tt-date"></div>
      <div class="tt-row"><span class="tt-dot" style="background:#34d399"></span><span id="tt-vol"></span></div>
      <div class="tt-row"><span class="tt-dot" style="background:#fb923c"></span><span id="tt-rm"></span></div>
    </div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" id="main-chart">
      ${[0,.5,1].map(t=>`<line x1="${P.l}" y1="${P.t+iH*(1-t)}" x2="${W-P.r}" y2="${P.t+iH*(1-t)}" stroke="#1e293b" stroke-width="1"/>`).join('')}
      <line id="vline" x1="0" y1="${P.t}" x2="0" y2="${P.t+iH}" stroke="#334155" stroke-width="1" stroke-dasharray="4" style="display:none"/>
      ${yLbl(vMin,vMax,'left')}${yLbl(rMin,rMax,'right')}${xLbl}
      <text x="${P.l-6}" y="${P.t-6}" text-anchor="end" fill="#34d399" font-size="10">Vægt</text>
      <text x="${W-P.r+6}" y="${P.t-6}" text-anchor="start" fill="#fb923c" font-size="10">1RM</text>
      <polyline points="${data.map((d,i)=>`${xOf(i)},${yOfV(d.vol)}`).join(' ')}" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <polyline points="${data.map((d,i)=>`${xOf(i)},${yOfR(d.rm)}`).join(' ')}"  fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${vDots}${rDots}
    </svg>
    <div style="display:flex;gap:14px;justify-content:center;margin-top:6px">
      <span style="font-size:12px;color:#34d399">● Max vægt (kg)</span>
      <span style="font-size:12px;color:#fb923c">● Est. 1RM (kg)</span>
    </div>
  </div>`;
}
function initChart() {
  const svg=document.getElementById('main-chart');
  const tip=document.getElementById('chart-tip');
  const vl =document.getElementById('vline');
  if (!svg) return;
  svg.querySelectorAll('.dot').forEach(dot=>{
    dot.style.cursor='pointer';
    const show=()=>{
      dot.setAttribute('r',7);
      document.getElementById('tt-date').textContent=dot.dataset.date;
      document.getElementById('tt-vol').textContent='Max vægt: '+dot.dataset.vol+'kg';
      document.getElementById('tt-rm').textContent='Est. 1RM: '+dot.dataset.rm+'kg';
      const cx=parseFloat(dot.getAttribute('cx'));
      const sx=svg.getBoundingClientRect().width/540;
      const x=cx*sx;
      vl.setAttribute('x1',cx); vl.setAttribute('x2',cx); vl.style.display='';
      tip.style.display='block';
      tip.style.left=(x+130>svg.getBoundingClientRect().width?x-130:x+10)+'px';
      tip.style.top='10px';
    };
    const hide=()=>{ dot.setAttribute('r',5); tip.style.display='none'; vl.style.display='none'; };
    dot.addEventListener('mouseenter',show);
    dot.addEventListener('mouseleave',hide);
    dot.addEventListener('touchstart',e=>{ e.preventDefault(); show(); setTimeout(hide,2000); });
  });
}

// ── Tabs ─────────────────────────────────────────────────────────
function showTab(tab) {
  ['log','templates','progress'].forEach(t=>{ document.getElementById('tab-'+t).style.display=t===tab?'':'none'; });
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['log','templates','progress'][i]===tab));
  closeDD();
  if (tab==='progress')  { renderExSelect(); renderProgress(); }
  if (tab==='templates') { renderTemplates(); renderCustomExercises(); }
  if (tab==='log')       { renderLog(); renderQuickTemplates(); updateStats(); }
}

// Load saved custom categories into EX_CAT on init
const savedCats = JSON.parse(localStorage.getItem('wt_custom_cats') || '{}');
Object.entries(savedCats).forEach(([ex, cat]) => EX_CAT[ex] = cat);

// ── Init ──────────────────────────────────────────────────────────
addSetRow();
renderLog();
updateStats();
renderQuickTemplates();
// Open today's group by default
if (workouts.length) { expandedDates.add(workouts[0].displayDate); renderLog(); }
</script>
