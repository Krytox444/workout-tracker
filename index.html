<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Workout Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.10.3/dist/Recharts.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend } = Recharts;

        // Icons as simple SVG components
        const Plus = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Trash2 = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const Dumbbell = ({ size = 32 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M14.4 14.4L9.6 9.6"></path>
                <path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"></path>
                <path d="M21.5 21.5l-1.4-1.4"></path>
                <path d="M3.9 3.9l1.4 1.4"></path>
                <path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"></path>
            </svg>
        );

        const TrendingUp = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
        );

        const Calendar = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        );

        const Target = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="6"></circle>
                <circle cx="12" cy="12" r="2"></circle>
            </svg>
        );

        const Award = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="8" r="7"></circle>
                <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
            </svg>
        );

        function WorkoutTracker() {
            const [workouts, setWorkouts] = useState([]);
            const [exercise, setExercise] = useState('');
            const [sets, setSets] = useState([{ reps: '', weight: '' }]);
            const [selectedExercise, setSelectedExercise] = useState('');
            const [view, setView] = useState('log');

            useEffect(() => {
                loadWorkouts();
            }, []);

            const loadWorkouts = () => {
                try {
                    const saved = localStorage.getItem('workouts');
                    if (saved) {
                        setWorkouts(JSON.parse(saved));
                    }
                } catch (error) {
                    console.log('Ingen tidligere data fundet');
                }
            };

            const saveWorkouts = (newWorkouts) => {
                try {
                    localStorage.setItem('workouts', JSON.stringify(newWorkouts));
                } catch (error) {
                    console.error('Kunne ikke gemme data:', error);
                }
            };

            const addSet = () => {
                setSets([...sets, { reps: '', weight: '' }]);
            };

            const updateSet = (index, field, value) => {
                const newSets = [...sets];
                newSets[index][field] = value;
                setSets(newSets);
            };

            const removeSet = (index) => {
                if (sets.length > 1) {
                    setSets(sets.filter((_, i) => i !== index));
                }
            };

            const addWorkout = () => {
                if (exercise && sets.some(s => s.reps && s.weight)) {
                    const validSets = sets.filter(s => s.reps && s.weight);
                    const newWorkout = {
                        id: Date.now(),
                        exercise,
                        sets: validSets.map(s => ({
                            reps: parseInt(s.reps),
                            weight: parseInt(s.weight)
                        })),
                        date: new Date().toISOString(),
                        displayDate: new Date().toLocaleDateString('da-DK')
                    };
                    const updatedWorkouts = [newWorkout, ...workouts];
                    setWorkouts(updatedWorkouts);
                    saveWorkouts(updatedWorkouts);
                    setExercise('');
                    setSets([{ reps: '', weight: '' }]);
                }
            };

            const deleteWorkout = (id) => {
                const updatedWorkouts = workouts.filter(w => w.id !== id);
                setWorkouts(updatedWorkouts);
                saveWorkouts(updatedWorkouts);
            };

            const calculateVolume = (workout) => {
                return workout.sets.reduce((sum, set) => sum + (set.reps * set.weight), 0);
            };

            const calculate1RM = (weight, reps) => {
                if (reps === 1) return weight;
                return Math.round(weight * (1 + reps / 30));
            };

            const getMax1RM = (workout) => {
                return Math.max(...workout.sets.map(set => calculate1RM(set.weight, set.reps)));
            };

            const totalVolume = workouts.reduce((sum, w) => sum + calculateVolume(w), 0);

            const uniqueExercises = [...new Set(workouts.map(w => w.exercise))];

            const getProgressionData = (exerciseName) => {
                return workouts
                    .filter(w => w.exercise === exerciseName)
                    .reverse()
                    .map((w, index) => {
                        const maxWeight = Math.max(...w.sets.map(s => s.weight));
                        const totalVolume = calculateVolume(w);
                        const estimated1RM = getMax1RM(w);
                        return {
                            session: index + 1,
                            date: w.displayDate,
                            'Max vægt (kg)': maxWeight,
                            'Total volumen (kg)': totalVolume,
                            'Estimeret 1RM (kg)': estimated1RM
                        };
                    });
            };

            const getProgressiveOverload = (exerciseName) => {
                const exerciseWorkouts = workouts
                    .filter(w => w.exercise === exerciseName)
                    .reverse();
                
                if (exerciseWorkouts.length < 2) return null;

                const latest = exerciseWorkouts[exerciseWorkouts.length - 1];
                const previous = exerciseWorkouts[exerciseWorkouts.length - 2];

                const latestVolume = calculateVolume(latest);
                const previousVolume = calculateVolume(previous);
                const latest1RM = getMax1RM(latest);
                const previous1RM = getMax1RM(previous);

                const volumeChange = latestVolume - previousVolume;
                const volumePercent = ((volumeChange / previousVolume) * 100).toFixed(1);
                const strengthChange = latest1RM - previous1RM;
                const strengthPercent = ((strengthChange / previous1RM) * 100).toFixed(1);

                return {
                    volumeChange,
                    volumePercent,
                    strengthChange,
                    strengthPercent,
                    isProgressing: volumeChange > 0 || strengthChange > 0
                };
            };

            const getLastWorkout = (exerciseName) => {
                const exerciseWorkouts = workouts.filter(w => w.exercise === exerciseName);
                return exerciseWorkouts.length > 0 ? exerciseWorkouts[0] : null;
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-4">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-slate-800 rounded-2xl shadow-2xl p-6 mb-6 border border-slate-700">
                            <div className="flex items-center gap-3 mb-6">
                                <div className="text-blue-400"><Dumbbell size={32} /></div>
                                <h1 className="text-3xl font-bold text-white">Workout Tracker</h1>
                            </div>

                            <div className="flex gap-2 mb-6 flex-wrap">
                                <button
                                    onClick={() => setView('log')}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-lg font-semibold transition-colors ${
                                        view === 'log' 
                                            ? 'bg-blue-600 text-white' 
                                            : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                    }`}
                                >
                                    <Calendar size={18} />
                                    Log træning
                                </button>
                                <button
                                    onClick={() => setView('progress')}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-lg font-semibold transition-colors ${
                                        view === 'progress' 
                                            ? 'bg-blue-600 text-white' 
                                            : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                    }`}
                                >
                                    <TrendingUp size={18} />
                                    Progression
                                </button>
                                <button
                                    onClick={() => setView('overload')}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-lg font-semibold transition-colors ${
                                        view === 'overload' 
                                            ? 'bg-blue-600 text-white' 
                                            : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                    }`}
                                >
                                    <Target size={18} />
                                    Progressive Overload
                                </button>
                            </div>

                            {view === 'log' && (
                                <>
                                    <div className="grid grid-cols-2 gap-4 mb-6">
                                        <div className="bg-slate-700 rounded-xl p-4 border border-slate-600">
                                            <p className="text-slate-400 text-sm">Total øvelser</p>
                                            <p className="text-3xl font-bold text-white">{workouts.length}</p>
                                        </div>
                                        <div className="bg-slate-700 rounded-xl p-4 border border-slate-600">
                                            <p className="text-slate-400 text-sm">Total volumen (kg)</p>
                                            <p className="text-3xl font-bold text-blue-400">{totalVolume}</p>
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        <input
                                            type="text"
                                            placeholder="Øvelse (fx Bænkpres)"
                                            value={exercise}
                                            onChange={(e) => setExercise(e.target.value)}
                                            list="exercises"
                                            className="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                        <datalist id="exercises">
                                            {uniqueExercises.map(ex => (
                                                <option key={ex} value={ex} />
                                            ))}
                                        </datalist>

                                        {exercise && getLastWorkout(exercise) && (
                                            <div className="bg-slate-700 border border-slate-600 rounded-lg p-3">
                                                <p className="text-slate-400 text-sm mb-2">Sidste gang ({getLastWorkout(exercise).displayDate}):</p>
                                                {getLastWorkout(exercise).sets.map((set, i) => (
                                                    <p key={i} className="text-slate-300 text-sm">
                                                        Set {i + 1}: {set.reps} reps @ {set.weight}kg
                                                    </p>
                                                ))}
                                            </div>
                                        )}
                                        
                                        <div className="space-y-2">
                                            {sets.map((set, index) => (
                                                <div key={index} className="flex gap-2 items-center">
                                                    <span className="text-slate-400 font-semibold w-12">Set {index + 1}</span>
                                                    <input
                                                        type="number"
                                                        placeholder="Reps"
                                                        value={set.reps}
                                                        onChange={(e) => updateSet(index, 'reps', e.target.value)}
                                                        className="flex-1 px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                    />
                                                    <input
                                                        type="number"
                                                        placeholder="Kg"
                                                        value={set.weight}
                                                        onChange={(e) => updateSet(index, 'weight', e.target.value)}
                                                        className="flex-1 px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                    />
                                                    {sets.length > 1 && (
                                                        <button
                                                            onClick={() => removeSet(index)}
                                                            className="text-red-400 hover:text-red-300 hover:bg-red-950 p-2 rounded-lg transition-colors"
                                                        >
                                                            <Trash2 size={20} />
                                                        </button>
                                                    )}
                                                </div>
                                            ))}
                                        </div>

                                        <button
                                            onClick={addSet}
                                            className="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 rounded-lg transition-colors"
                                        >
                                            + Tilføj set
                                        </button>

                                        <button
                                            onClick={addWorkout}
                                            className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg flex items-center justify-center gap-2 transition-colors"
                                        >
                                            <Plus />
                                            Gem øvelse
                                        </button>
                                    </div>
                                </>
                            )}

                            {view === 'progress' && (
                                <div className="space-y-4">
                                    <select
                                        value={selectedExercise}
                                        onChange={(e) => setSelectedExercise(e.target.value)}
                                        className="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    >
                                        <option value="">Vælg en øvelse</option>
                                        {uniqueExercises.map(ex => (
                                            <option key={ex} value={ex}>{ex}</option>
                                        ))}
                                    </select>

                                    {selectedExercise && (
                                        <div className="bg-slate-700 rounded-xl p-6 border border-slate-600">
                                            <h3 className="text-xl font-bold text-white mb-4">{selectedExercise}</h3>
                                            <ResponsiveContainer width="100%" height={300}>
                                                <LineChart data={getProgressionData(selectedExercise)}>
                                                    <CartesianGrid strokeDasharray="3 3" stroke="#475569" />
                                                    <XAxis 
                                                        dataKey="date" 
                                                        stroke="#94a3b8"
                                                        style={{ fontSize: '12px' }}
                                                    />
                                                    <YAxis 
                                                        stroke="#94a3b8"
                                                        style={{ fontSize: '12px' }}
                                                    />
                                                    <Tooltip 
                                                        contentStyle={{ 
                                                            backgroundColor: '#1e293b', 
                                                            border: '1px solid #475569',
                                                            borderRadius: '8px'
                                                        }}
                                                    />
                                                    <Legend />
                                                    <Line 
                                                        type="monotone" 
                                                        dataKey="Estimeret 1RM (kg)" 
                                                        stroke="#f59e0b" 
                                                        strokeWidth={2}
                                                        dot={{ fill: '#f59e0b', r: 4 }}
                                                    />
                                                    <Line 
                                                        type="monotone" 
                                                        dataKey="Total volumen (kg)" 
                                                        stroke="#10b981" 
                                                        strokeWidth={2}
                                                        dot={{ fill: '#10b981', r: 4 }}
                                                    />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        </div>
                                    )}
                                </div>
                            )}

                            {view === 'overload' && (
                                <div className="space-y-4">
                                    {uniqueExercises.length === 0 ? (
                                        <div className="text-center py-12">
                                            <div className="flex justify-center mb-4 text-slate-600">
                                                <Target size={48} />
                                            </div>
                                            <p className="text-slate-400 text-lg">Log mindst 2 træningspas for at se progressive overload</p>
                                        </div>
                                    ) : (
                                        uniqueExercises.map(ex => {
                                            const overload = getProgressiveOverload(ex);
                                            const workoutCount = workouts.filter(w => w.exercise === ex).length;
                                            
                                            return (
                                                <div key={ex} className="bg-slate-700 rounded-xl p-5 border border-slate-600">
                                                    <div className="flex items-start justify-between mb-3">
                                                        <h3 className="text-xl font-bold text-white">{ex}</h3>
                                                        <span className="text-slate-400 text-sm">{workoutCount} sessions</span>
                                                    </div>
                                                    
                                                    {overload ? (
                                                        <div className="space-y-3">
                                                            <div className={`flex items-center gap-2 p-3 rounded-lg ${
                                                                overload.isProgressing ? 'bg-green-900/30 border border-green-700' : 'bg-yellow-900/30 border border-yellow-700'
                                                            }`}>
                                                                <div className={overload.isProgressing ? 'text-green-400' : 'text-yellow-400'}>
                                                                    <Award size={24} />
                                                                </div>
                                                                <span className={`font-semibold ${overload.isProgressing ? 'text-green-400' : 'text-yellow-400'}`}>
                                                                    {overload.isProgressing ? 'Du progresserer! 🎉' : 'Ingen fremgang endnu'}
                                                                </span>
                                                            </div>

                                                            <div className="grid grid-cols-2 gap-3">
                                                                <div className="bg-slate-800 rounded-lg p-3">
                                                                    <p className="text-slate-400 text-sm mb-1">Volumen ændring</p>
                                                                    <p className={`text-2xl font-bold ${overload.volumeChange >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                                        {overload.volumeChange >= 0 ? '+' : ''}{overload.volumeChange}kg
                                                                    </p>
                                                                    <p className={`text-sm ${overload.volumePercent >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                                        {overload.volumePercent >= 0 ? '+' : ''}{overload.volumePercent}%
                                                                    </p>
                                                                </div>

                                                                <div className="bg-slate-800 rounded-lg p-3">
                                                                    <p className="text-slate-400 text-sm mb-1">Styrke ændring (1RM)</p>
                                                                    <p className={`text-2xl font-bold ${overload.strengthChange >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                                        {overload.strengthChange >= 0 ? '+' : ''}{overload.strengthChange}kg
                                                                    </p>
                                                                    <p className={`text-sm ${overload.strengthPercent >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                                        {overload.strengthPercent >= 0 ? '+' : ''}{overload.strengthPercent}%
                                                                    </p>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <p className="text-slate-400">Log mindst 2 træningspas for at se progression</p>
                                                    )}
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            )}
                        </div>

                        {view === 'log' && (
                            <div className="space-y-3">
                                {workouts.map((workout) => (
                                    <div
                                        key={workout.id}
                                        className="bg-slate-800 border border-slate-700 rounded-xl p-4 hover:border-slate-600 transition-colors"
                                    >
                                        <div className="flex items-start justify-between mb-2">
                                            <div className="flex-1">
                                                <h3 className="text-white font-semibold text-lg">{workout.exercise}</h3>
                                                <p className="text-slate-500 text-sm">{workout.displayDate}</p>
                                            </div>
                                            <button
                                                onClick={() => deleteWorkout(workout.id)}
                                                className="text-red-400 hover:text-red-300 hover:bg-red-950 p-2 rounded-lg transition-colors"
                                            >
                                                <Trash2 size={20} />
                                            </button>
                                        </div>
                                        <div className="space-y-1">
                                            {workout.sets.map((set, index) => (
                                                <p key={index} className="text-slate-400">
                                                    Set {index + 1}: {set.reps} reps @ {set.weight}kg
                                                </p>
                                            ))}
                                            <div className="flex gap-4 mt-2 pt-2 border-t border-slate-700">
                                                <p className="text-blue-400 font-semibold text-sm">
                                                    Volumen: {calculateVolume(workout)}kg
                                                </p>
                                                <p className="text-orange-400 font-semibold text-sm">
                                                    Est. 1RM: {getMax1RM(workout)}kg
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {workouts.length === 0 && view === 'log' && (
                            <div className="text-center py-12">
                                <div className="flex justify-center mb-4 text-slate-600">
                                    <Dumbbell size={48} />
                                </div>
                                <p className="text-slate-400 text-lg">Ingen øvelser endnu. Start dit workout!</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<WorkoutTracker />, document.getElementById('root'));
    </script>
</body>
</html>
