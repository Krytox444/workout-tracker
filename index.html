<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>Workout Tracker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;padding:16px}
  .container{max-width:600px;margin:0 auto}
  .card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:16px}
  h1{font-size:24px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .tab{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:14px;transition:all .2s}
  .tab.active{background:#2563eb;color:#fff}
  .tab:not(.active){background:#334155;color:#94a3b8}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
  .stat{background:#334155;border-radius:12px;padding:16px}
  .stat-label{font-size:12px;color:#94a3b8;margin-bottom:4px}
  .stat-value{font-size:28px;font-weight:700}
  .blue{color:#60a5fa} .green{color:#34d399} .orange{color:#fb923c} .red{color:#f87171} .yellow{color:#fbbf24}
  input,select{width:100%;padding:12px;background:#334155;border:1px solid #475569;border-radius:8px;color:#fff;font-size:16px;margin-bottom:8px;outline:none}
  input:focus,select:focus{border-color:#2563eb}
  input::placeholder{color:#64748b}
  .set-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .set-row span{color:#94a3b8;font-weight:600;width:48px;font-size:14px;flex-shrink:0}
  .set-row input{margin-bottom:0;flex:1}
  .btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:600;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;margin-top:8px}
  .btn-primary{background:#2563eb;color:#fff} .btn-primary:hover{background:#1d4ed8}
  .btn-secondary{background:#334155;color:#fff} .btn-secondary:hover{background:#475569}
  .btn-danger{background:none;border:none;color:#f87171;cursor:pointer;padding:8px;border-radius:8px}
  .workout-item{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:12px}
  .workout-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
  .workout-name{font-weight:600;font-size:18px}
  .workout-date{font-size:12px;color:#64748b}
  .set-line{color:#94a3b8;font-size:14px;margin-bottom:2px}
  .workout-footer{display:flex;gap:16px;margin-top:8px;padding-top:8px;border-top:1px solid #334155}
  .badge{font-size:13px;font-weight:600}
  .last-session{background:#334155;border-radius:8px;padding:12px;margin-bottom:8px}
  .last-session p{font-size:12px;color:#94a3b8;margin-bottom:4px}
  .last-session span{font-size:13px;color:#cbd5e1}
  /* Progress tab */
  .exercise-card{background:#334155;border-radius:12px;padding:16px;margin-bottom:12px}
  .exercise-card h3{font-size:18px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between}
  .exercise-card h3 small{font-size:13px;color:#94a3b8;font-weight:400}
  .progress-badge{display:flex;align-items:center;gap:8px;padding:10px;border-radius:8px;margin-bottom:12px;font-weight:600}
  .progress-badge.good{background:rgba(16,185,129,.15);border:1px solid #059669}
  .progress-badge.bad{background:rgba(234,179,8,.15);border:1px solid #ca8a04}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .metric{background:#1e293b;border-radius:8px;padding:12px}
  .metric-label{font-size:12px;color:#94a3b8;margin-bottom:4px}
  .metric-value{font-size:22px;font-weight:700}
  .metric-sub{font-size:12px;margin-top:2px}
  /* SVG Chart */
  .chart-wrap{width:100%;overflow-x:auto}
  svg.chart{display:block;width:100%;height:180px}
  .empty{text-align:center;padding:48px 0;color:#64748b}
  .empty svg{margin:0 auto 12px;display:block;opacity:.4}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><path d="M6.5 6.5l11 11M17 7l1.5-1.5a2 2 0 0 1 2.83 2.83L19.83 9.8a2 2 0 0 1-2.83 0L17 9.63A2 2 0 0 1 17 7zM7 17l-1.5 1.5a2 2 0 0 1-2.83-2.83L4.17 14.2a2 2 0 0 1 2.83 0L7 14.37A2 2 0 0 1 7 17z"/></svg>
      Workout Tracker
    </h1>

    <div class="tabs">
      <button class="tab active" onclick="showTab('log')">📋 Log træning</button>
      <button class="tab" onclick="showTab('progress')">📈 Progression</button>
    </div>

    <!-- LOG TAB -->
    <div id="tab-log">
      <div class="stats">
        <div class="stat"><div class="stat-label">Total øvelser</div><div class="stat-value" id="total-count">0</div></div>
        <div class="stat"><div class="stat-label">Total volumen</div><div class="stat-value blue" id="total-vol">0 kg</div></div>
      </div>

      <input type="text" id="exercise-input" placeholder="Øvelse (fx Bænkpres)" oninput="onExerciseInput(this.value)" list="exercise-list" autocomplete="off">
      <datalist id="exercise-list"></datalist>

      <div id="last-session-box" style="display:none" class="last-session">
        <p>Sidst du trænede denne øvelse:</p>
        <div id="last-session-sets"></div>
      </div>

      <div id="sets-container"></div>

      <button class="btn btn-secondary" onclick="addSetRow()">+ Tilføj set</button>
      <button class="btn btn-primary" onclick="saveWorkout()">💾 Gem øvelse</button>
    </div>

    <!-- PROGRESS TAB -->
    <div id="tab-progress" style="display:none">
      <select id="exercise-select" onchange="renderProgress()">
        <option value="">Vælg en øvelse...</option>
      </select>
      <div id="progress-content"></div>
    </div>
  </div>

  <!-- WORKOUT LOG -->
  <div id="workout-log"></div>
</div>

<script>
let workouts = JSON.parse(localStorage.getItem('workouts') || '[]');
let setCount = 1;

function save() { localStorage.setItem('workouts', JSON.stringify(workouts)); }

function calc1RM(w, r) { return r === 1 ? w : Math.round(w * (1 + r / 30)); }
function calcVolume(sets) { return sets.reduce((s, x) => s + x.reps * x.weight, 0); }
function getMax1RM(sets) { return Math.max(...sets.map(s => calc1RM(s.weight, s.reps))); }

function showTab(tab) {
  document.getElementById('tab-log').style.display = tab === 'log' ? '' : 'none';
  document.getElementById('tab-progress').style.display = tab === 'progress' ? '' : 'none';
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (tab === 'log') === (i === 0)));
  if (tab === 'progress') renderExerciseSelect();
  if (tab === 'log') renderLog();
}

function addSetRow(reps = '', weight = '') {
  const c = document.getElementById('sets-container');
  const div = document.createElement('div');
  div.className = 'set-row';
  div.innerHTML = `<span>Set ${setCount++}</span>
    <input type="number" placeholder="Reps" value="${reps}" min="1">
    <input type="number" placeholder="Kg" value="${weight}" min="0" step="0.5">
    <button class="btn-danger" onclick="this.parentNode.remove(); renumberSets()">✕</button>`;
  c.appendChild(div);
}

function renumberSets() {
  document.querySelectorAll('#sets-container .set-row span').forEach((s, i) => s.textContent = `Set ${i + 1}`);
  setCount = document.querySelectorAll('#sets-container .set-row').length + 1;
}

function onExerciseInput(val) {
  const last = workouts.find(w => w.exercise.toLowerCase() === val.toLowerCase());
  const box = document.getElementById('last-session-box');
  if (last) {
    box.style.display = '';
    document.getElementById('last-session-sets').innerHTML = last.sets.map((s, i) =>
      `<span>Set ${i + 1}: ${s.reps} reps @ ${s.weight}kg</span><br>`).join('');
  } else {
    box.style.display = 'none';
  }
}

function saveWorkout() {
  const ex = document.getElementById('exercise-input').value.trim();
  if (!ex) return alert('Indtast øvelsesnavn!');
  const rows = document.querySelectorAll('#sets-container .set-row');
  const sets = [];
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input');
    const r = parseInt(inputs[0].value), w = parseFloat(inputs[1].value);
    if (r && w) sets.push({ reps: r, weight: w });
  });
  if (!sets.length) return alert('Tilføj mindst ét set!');
  workouts.unshift({ id: Date.now(), exercise: ex, sets, date: new Date().toISOString(), displayDate: new Date().toLocaleDateString('da-DK') });
  save();
  document.getElementById('exercise-input').value = '';
  document.getElementById('sets-container').innerHTML = '';
  document.getElementById('last-session-box').style.display = 'none';
  setCount = 1;
  addSetRow();
  renderLog();
  updateStats();
  updateDatalist();
}

function deleteWorkout(id) {
  workouts = workouts.filter(w => w.id !== id);
  save(); renderLog(); updateStats();
}

function renderLog() {
  const el = document.getElementById('workout-log');
  if (!workouts.length) { el.innerHTML = '<div class="empty"><p>Ingen øvelser endnu. Start dit workout! 💪</p></div>'; return; }
  el.innerHTML = workouts.map(w => `
    <div class="workout-item">
      <div class="workout-header">
        <div>
          <div class="workout-name">${w.exercise}</div>
          <div class="workout-date">${w.displayDate}</div>
        </div>
        <button class="btn-danger" onclick="deleteWorkout(${w.id})">🗑</button>
      </div>
      ${w.sets.map((s, i) => `<div class="set-line">Set ${i + 1}: ${s.reps} reps @ ${s.weight}kg</div>`).join('')}
      <div class="workout-footer">
        <span class="badge blue">Volumen: ${calcVolume(w.sets)}kg</span>
        <span class="badge orange">Est. 1RM: ${getMax1RM(w.sets)}kg</span>
      </div>
    </div>`).join('');
}

function updateStats() {
  document.getElementById('total-count').textContent = workouts.length;
  document.getElementById('total-vol').textContent = workouts.reduce((s, w) => s + calcVolume(w.sets), 0) + ' kg';
}

function updateDatalist() {
  const exercises = [...new Set(workouts.map(w => w.exercise))];
  document.getElementById('exercise-list').innerHTML = exercises.map(e => `<option value="${e}">`).join('');
}

function renderExerciseSelect() {
  const exercises = [...new Set(workouts.map(w => w.exercise))];
  const sel = document.getElementById('exercise-select');
  const current = sel.value;
  sel.innerHTML = '<option value="">Vælg en øvelse...</option>' + exercises.map(e => `<option value="${e}" ${e === current ? 'selected' : ''}>${e}</option>`).join('');
  if (current) renderProgress();
}

function renderProgress() {
  const ex = document.getElementById('exercise-select').value;
  const el = document.getElementById('progress-content');
  if (!ex) { el.innerHTML = ''; return; }

  const sessions = workouts.filter(w => w.exercise === ex).reverse();
  if (sessions.length < 1) { el.innerHTML = '<div class="empty">Ingen data endnu</div>'; return; }

  // Overload vs previous session
  let overloadHTML = '';
  if (sessions.length >= 2) {
    const latest = sessions[sessions.length - 1];
    const prev = sessions[sessions.length - 2];
    const volChange = calcVolume(latest.sets) - calcVolume(prev.sets);
    const rmChange = getMax1RM(latest.sets) - getMax1RM(prev.sets);
    const progressing = volChange > 0 || rmChange > 0;
    overloadHTML = `
      <div class="progress-badge ${progressing ? 'good' : 'bad'}">
        ${progressing ? '🏆 Du progresserer!' : '⚠️ Ingen fremgang siden sidst'}
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Volumen ændring</div>
          <div class="metric-value ${volChange >= 0 ? 'green' : 'red'}">${volChange >= 0 ? '+' : ''}${volChange}kg</div>
        </div>
        <div class="metric">
          <div class="metric-label">Styrke (1RM)</div>
          <div class="metric-value ${rmChange >= 0 ? 'green' : 'red'}">${rmChange >= 0 ? '+' : ''}${rmChange}kg</div>
        </div>
      </div>`;
  }

  // SVG chart
  const data = sessions.map(s => ({ date: s.displayDate, vol: calcVolume(s.sets), rm: getMax1RM(s.sets) }));
  const chartHTML = sessions.length >= 2 ? drawChart(data) : '<p style="color:#64748b;font-size:13px;margin-top:8px">Log mindst 2 sessions for at se graf</p>';

  el.innerHTML = `<div class="exercise-card">
    <h3>${ex} <small>${sessions.length} sessions</small></h3>
    ${overloadHTML}
    <div class="metric-label" style="margin-bottom:8px">Progression over tid</div>
    ${chartHTML}
  </div>`;
}

function drawChart(data) {
  const W = 560, H = 160, PAD = { t: 10, r: 20, b: 30, l: 45 };
  const iW = W - PAD.l - PAD.r, iH = H - PAD.t - PAD.b;
  const vols = data.map(d => d.vol), rms = data.map(d => d.rm);
  const allVals = [...vols, ...rms];
  const minV = Math.min(...allVals) * 0.9, maxV = Math.max(...allVals) * 1.1;
  const xStep = iW / (data.length - 1 || 1);
  const yScale = v => iH - ((v - minV) / (maxV - minV || 1)) * iH;
  const pts = (arr) => arr.map((v, i) => `${PAD.l + i * xStep},${PAD.t + yScale(v)}`).join(' ');
  const n = data.length;
  // Y axis labels
  const yLabels = [minV, (minV + maxV) / 2, maxV].map(v => Math.round(v));
  const yLabelHTML = yLabels.map((v, i) => {
    const y = PAD.t + iH - (i / 2) * iH;
    return `<text x="${PAD.l - 6}" y="${y + 4}" text-anchor="end" fill="#64748b" font-size="11">${v}</text>`;
  }).join('');
  // X axis labels (show max 5)
  const step = Math.max(1, Math.floor(n / 5));
  const xLabelHTML = data.filter((_, i) => i % step === 0 || i === n - 1).map((d, i, arr) => {
    const origIdx = data.indexOf(d);
    const x = PAD.l + origIdx * xStep;
    const label = d.date.slice(0, 5); // dd/mm
    return `<text x="${x}" y="${H - 6}" text-anchor="middle" fill="#64748b" font-size="10">${label}</text>`;
  }).join('');

  return `<div class="chart-wrap">
  <svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <!-- grid -->
    ${[0, 0.5, 1].map(t => `<line x1="${PAD.l}" y1="${PAD.t + iH * (1 - t)}" x2="${PAD.l + iW}" y2="${PAD.t + iH * (1 - t)}" stroke="#334155" stroke-width="1"/>`).join('')}
    <!-- axes labels -->
    ${yLabelHTML}${xLabelHTML}
    <!-- volume line -->
    <polyline points="${pts(vols)}" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round"/>
    ${vols.map((v, i) => `<circle cx="${PAD.l + i * xStep}" cy="${PAD.t + yScale(v)}" r="4" fill="#34d399"/>`).join('')}
    <!-- 1RM line -->
    <polyline points="${pts(rms)}" fill="none" stroke="#fb923c" stroke-width="2" stroke-linejoin="round"/>
    ${rms.map((v, i) => `<circle cx="${PAD.l + i * xStep}" cy="${PAD.t + yScale(v)}" r="4" fill="#fb923c"/>`).join('')}
    <!-- legend -->
    <rect x="${PAD.l}" y="${PAD.t}" width="10" height="10" rx="2" fill="#34d399"/>
    <text x="${PAD.l + 14}" y="${PAD.t + 9}" fill="#94a3b8" font-size="11">Volumen (kg)</text>
    <rect x="${PAD.l + 100}" y="${PAD.t}" width="10" height="10" rx="2" fill="#fb923c"/>
    <text x="${PAD.l + 114}" y="${PAD.t + 9}" fill="#94a3b8" font-size="11">Est. 1RM (kg)</text>
  </svg></div>`;
}

// Init
addSetRow();
renderLog();
updateStats();
updateDatalist();
</script>
</body>
</html>
